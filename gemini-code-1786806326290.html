<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Калькулятор з аналітикою</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Chart.js для аналітики -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f9);
      --text-color: var(--tg-theme-text-color, #222222);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-bg: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #888888);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0 0 5px 0;
    }

    .user-greeting {
      font-size: 14px;
      color: var(--hint-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--hint-color);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    button.btn-secondary {
      background-color: rgba(0, 0, 0, 0.08);
      color: var(--text-color);
    }

    .result-box {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      padding: 10px;
      background-color: rgba(36, 129, 204, 0.1);
      border-radius: 8px;
      color: var(--button-bg);
    }

    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Калькулятор + Аналітика</h2>
      <div id="user-greeting" class="user-greeting">Вітаємо у застосунку!</div>
    </div>

    <!-- Блок Калькулятора -->
    <div class="card">
      <div class="form-group">
        <label for="amount">Сума / Показник (₴)</label>
        <input type="number" id="amount" placeholder="Наприклад: 1500" value="1000">
      </div>

      <div class="form-group">
        <label for="operation">Операція</label>
        <select id="operation">
          <option value="income">Дохід (+)</option>
          <option value="expense">Витрата (-)</option>
        </select>
      </div>

      <div class="btn-group">
        <button onclick="addEntry()">Записати</button>
        <button class="btn-secondary" onclick="clearData()">Очистити</button>
      </div>

      <div class="result-box" id="total-balance">
        Баланс: 0 ₴
      </div>
    </div>

    <!-- Блок Графіка Аналітики -->
    <div class="card">
      <label>Аналітика операцій</label>
      <div class="chart-container">
        <canvas id="analyticsChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // --- 1. ІНІЦІАЛІЗАЦІЯ ТА MOCK ДЛЯ ЗВИЧАЙНОГО БРАУЗЕРА ---
    if (!window.Telegram?.WebApp?.initData) {
      window.Telegram = {
        WebApp: {
          expand: () => {},
          ready: () => {},
          initDataUnsafe: {
            user: { first_name: "Тестовий Користувач" }
          },
          HapticFeedback: {
            impactOccurred: (style) => console.log(`Haptic feedback: ${style}`)
          }
        }
      };
    }

    const tg = window.Telegram.WebApp;
    tg.expand(); // Розгортаємо Mini App на весь екран

    // Привітання користувача
    if (tg.initDataUnsafe?.user) {
      document.getElementById('user-greeting').innerText = `Привіт, ${tg.initDataUnsafe.user.first_name}!`;
    }

    // --- 2. ЛОГІКА ДАНИХ ТА КАЛЬКУЛЯТОРА ---
    let history = [
      { type: 'income', amount: 5000, label: 'Запис 1' },
      { type: 'expense', amount: 1200, label: 'Запис 2' },
      { type: 'expense', amount: 800, label: 'Запис 3' }
    ];

    let chartInstance = null;

    function triggerHaptic() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
    }

    function calculateTotal() {
      const total = history.reduce((acc, item) => {
        return item.type === 'income' ? acc + item.amount : acc - item.amount;
      }, 0);

      document.getElementById('total-balance').innerText = `Баланс: ${total.toLocaleString()} ₴`;
    }

    function addEntry() {
      triggerHaptic();

      const amountInput = document.getElementById('amount');
      const operationSelect = document.getElementById('operation');
      const val = parseFloat(amountInput.value);

      if (isNaN(val) || val <= 0) return;

      history.push({
        type: operationSelect.value,
        amount: val,
        label: `Запис ${history.length + 1}`
      });

      amountInput.value = '';
      updateUI();
    }

    function clearData() {
      triggerHaptic();
      history = [];
      updateUI();
    }

    // --- 3. ГРАФІК АНАЛІТИКИ (CHART.JS) ---
    function initChart() {
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Доходи', 'Витрати'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#2ec4b6', '#e71d36'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: getComputedStyle(document.body).getPropertyValue('--text-color') || '#222'
              }
            }
          }
        }
      });
    }

    function updateChart() {
      const incomeTotal = history
        .filter(i => i.type === 'income')
        .reduce((sum, i) => sum + i.amount, 0);

      const expenseTotal = history
        .filter(i => i.type === 'expense')
        .reduce((sum, i) => sum + i.amount, 0);

      chartInstance.data.datasets[0].data = [incomeTotal, expenseTotal];
      chartInstance.update();
    }

    function updateUI() {
      calculateTotal();
      updateChart();
    }

    // Запуск при завантаженні
    window.onload = () => {
      initChart();
      updateUI();
    };
  </script>
</body>
</html>
