<!-- HEATMAP CONTAINER -->
<div class="bg-brandCard/90 p-4 rounded-2xl border border-brandBorder space-y-4">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
    <div>
      <h3 class="text-xs font-bold uppercase text-neonGreen">🔥 Теплова Карта Активності (Години vs Дні Тижня)</h3>
      <p class="text-[10px] text-gray-400">Показує суму виручки за годинами доби протягом місяця</p>
    </div>
    
    <!-- Селект вибору місяця -->
    <div class="flex items-center gap-2">
      <label for="heatmapMonthSelect" class="text-[10px] text-gray-400 font-bold uppercase">Місяць:</label>
      <select id="heatmapMonthSelect" class="bg-brandDark text-xs font-mono text-white p-1.5 rounded-xl border border-brandBorder focus:outline-none focus:border-neonGreen">
        <option value="all">Усі місяці</option>
        <option value="0">Січень</option>
        <option value="1">Лютий</option>
        <option value="2">Березень</option>
        <option value="3">Квітень</option>
        <option value="4">Травень</option>
        <option value="5">Червень</option>
        <option value="6">Липень</option>
        <option value="7">Серпень</option>
        <option value="8">Вересень</option>
        <option value="9">Жовтень</option>
        <option value="10">Листопад</option>
        <option value="11">Грудень</option>
      </select>
    </div>
  </div>

  <!-- Heatmap Matrix Grid -->
  <div class="overflow-x-auto">
    <div id="heatmapGrid" class="min-w-[650px] space-y-1 font-mono text-[10px]"></div>
  </div>
</div>
