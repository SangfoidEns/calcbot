<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HMS2 Shopping List</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 antialiased">

  <!-- Header Section -->
  <header class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="userAvatar" class="w-10 h-10 rounded-full bg-cyan-500/20 text-cyan-400 font-bold flex items-center justify-center border border-cyan-500/30">
          U
        </div>
        <div>
          <h1 id="userName" class="font-bold text-sm leading-tight text-white">Завантаження...</h1>
          <p id="userHandle" class="text-xs text-gray-400">@user</p>
        </div>
      </div>
      <span class="text-xs font-mono bg-cyan-950 text-cyan-400 px-2 py-1 rounded border border-cyan-800">HMS2 v1.0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Analytics Dashboard Widget -->
    <section id="analyticsStats"></section>

    <!-- Form Section -->
    <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 shadow-xl backdrop-blur-sm space-y-3">
      <form id="addPurchaseForm" class="flex gap-2">
        <input 
          type="text" 
          id="purchaseInput" 
          placeholder="Наприклад: Молоко 2л терміново..." 
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors"
        />
        <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2.5 rounded-lg text-sm transition-all active:scale-95">
          Додати
        </button>
      </form>

      <!-- Forecast AI Recommendations -->
      <div>
        <p class="text-[10px] uppercase font-semibold text-gray-400 mb-1.5">Прогноз покупок (Smart Forecast):</p>
        <div id="forecastList" class="flex flex-wrap gap-1.5"></div>
      </div>
    </section>

    <!-- List Section -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3 px-1">Список покупок</h2>
      <div id="purchasesList" class="space-y-2"></div>
    </section>

  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
